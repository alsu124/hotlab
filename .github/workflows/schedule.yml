name: Render schedule

on:
  push:
    branches: [main]
    paths:
      - 'schedule.json'
      - 'tools/render_schedule.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-commits
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate schedule.json and rebuild the schedule on the pages
        run: python3 tools/render_schedule.py

      - name: Commit if changed
        run: |
          if ! git diff --quiet -- index.html raspisanie-i-tseny.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html raspisanie-i-tseny.html
            git commit -m "chore: render schedule from schedule.json [skip ci]"
            git push
          fi
