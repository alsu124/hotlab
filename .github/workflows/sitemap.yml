name: Update sitemap

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'generate-sitemap.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate sitemap.xml
        run: |
          chmod +x generate-sitemap.sh
          ./generate-sitemap.sh

      - name: Commit if changed
        run: |
          if ! git diff --quiet -- sitemap.xml; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "chore: regenerate sitemap.xml [skip ci]"
            git push
          else
            echo "sitemap.xml unchanged"
          fi
